name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36"

      - run: npm ci
      - run: npm run build:apk
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk family-games.apk

      - name: Publish to a stable "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Family Games (Android)
          body: >
            Auto-built from the latest push to main. This always replaces
            the previous build, so this is always the newest version.


            **Install:** download family-games.apk below, open it on your
            phone, and allow "install from this source" if asked (a one-time
            Android setting). Then open the app, paste your family's Daily.co
            room link once, and you're in.
          files: family-games.apk
          prerelease: true
